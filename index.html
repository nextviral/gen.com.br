<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Viral — A Estratégia Completa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --n900:#171717; --n800:#262626; --n400:#a3a3a3; --n300:#d4d4d4; --n200:#e5e5e5;
  --blue:#60a5fa; --blue3:#93c5fd; --blue5:#3b82f6; --rose:#fb7185; --rose3:#fda4af; --em:#34d399; --em3:#6ee7b7; --amber:#fbbf24;
  --card:linear-gradient(225deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.05) 50%,rgba(255,255,255,0) 100%);
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[lang=ja]{--font:Inter,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
html[lang=ar]{--font:"Noto Sans Arabic",Inter,Tahoma,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{min-height:100vh;background:var(--bg);color:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
strong{color:#fff;font-weight:600}
@keyframes fadeSlideIn{0%{opacity:0;transform:translateY(30px);filter:blur(8px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes pulse{50%{opacity:.4}}
.anim{animation:fadeSlideIn .8s ease-out both;animation-play-state:paused}
.anim.in{animation-play-state:running}
@media (prefers-reduced-motion:reduce){.anim{animation:none}}

/* shared border gradient */
.bg-grad{position:relative}
.bg-grad::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;background:linear-gradient(225deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.2) 50%,rgba(255,255,255,0) 100%);pointer-events:none}

/* backgrounds */
.bg-anim{position:fixed;top:0;left:0;width:100%;height:100vh;z-index:0;filter:brightness(.5) saturate(.5) blur(4px);-webkit-mask-image:linear-gradient(to bottom,black 0%,black 80%,transparent);mask-image:linear-gradient(to bottom,black 0%,black 80%,transparent);pointer-events:none}
.bg-anim>div{position:absolute;inset:0;background:var(--bg)}
.bg-grid{position:fixed;inset:0;z-index:0;opacity:.03;pointer-events:none}
.glow{position:fixed;border-radius:9999px;filter:blur(64px);pointer-events:none;z-index:0}

.wrap{position:relative;z-index:10;max-width:80rem;margin:0 auto;padding:0 1rem}
@media(min-width:640px){.wrap{padding:0 1.5rem}}
@media(min-width:1024px){.wrap{padding:0 2rem}}

/* progress */
#progress{position:fixed;top:0;inset-inline-start:0;height:2px;width:0;background:linear-gradient(90deg,var(--blue),var(--blue3));z-index:60;box-shadow:0 0 12px rgba(59,130,246,.6)}

/* header */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(10,10,10,.55);border-bottom:1px solid rgba(255,255,255,.06)}
nav.top{display:flex;align-items:center;justify-content:space-between;padding:1rem 0;gap:1rem}
.brand{display:flex;align-items:center;gap:.75rem}
.logo{display:inline-flex;align-items:center;justify-content:center;width:2.25rem;height:2.25rem;border-radius:9999px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px)}
.brand b{font-size:1.125rem;font-weight:600;letter-spacing:-.025em}
.links{display:none;gap:2rem;font-size:.875rem;color:var(--n300)}
.links a{font-weight:500;transition:color .2s}.links a:hover{color:#fff}
@media(min-width:900px){.links{display:flex}}
.pill{display:inline-flex;align-items:center;gap:.5rem;border-radius:9999px;background:rgba(255,255,255,.05);padding:.375rem .75rem;font-size:.75rem;color:var(--n300);font-weight:500}
.dot{width:.5rem;height:.5rem;border-radius:9999px;background:var(--blue);display:inline-block}

/* language switcher */
.lang{position:relative}
.lang-btn{display:inline-flex;align-items:center;gap:.5rem;border-radius:9999px;background:rgba(255,255,255,.05);backdrop-filter:blur(24px);padding:.625rem 1rem;font:500 .875rem var(--font);color:rgba(255,255,255,.8);border:0;cursor:pointer;transition:all .2s}
.lang-btn:hover{color:#fff;transform:translateY(-2px)}
.lang-btn .code{display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;background:rgba(96,165,250,.2);color:var(--blue3);padding:.05rem .45rem;font-size:.7rem;font-weight:600;letter-spacing:.02em}
.lang-menu{position:absolute;top:calc(100% + .5rem);inset-inline-end:0;min-width:15rem;border-radius:20px;background:rgba(18,18,18,.92);backdrop-filter:blur(24px);padding:.4rem;display:none;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:70vh;overflow:auto}
.lang.open .lang-menu{display:block;animation:fadeSlideIn .35s ease-out both}
.lang-menu button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem .8rem;border:0;background:transparent;color:var(--n300);font:500 .875rem var(--font);border-radius:12px;cursor:pointer;text-align:start}
.lang-menu button:hover{background:rgba(255,255,255,.06);color:#fff}
.lang-menu button[aria-current=true]{background:rgba(96,165,250,.12);color:var(--blue3)}
.lang-menu small{font-size:.7rem;color:var(--n400);font-weight:600;letter-spacing:.04em}

/* hero */
.hero{padding:4rem 0 3.5rem;text-align:center}
@media(min-width:1024px){.hero{padding:6rem 0 4.5rem}}
.hero .pill .new{display:inline-flex;align-items:center;border-radius:9999px;background:rgba(96,165,250,.2);color:var(--blue3);padding:.125rem .5rem}
.kicker{margin-top:1.75rem;font-size:.8rem;letter-spacing:.35em;text-transform:uppercase;color:rgba(191,219,254,.8);font-weight:500}
html[lang=ar] .kicker,html[lang=ja] .kicker{letter-spacing:.15em}
h1{margin:1rem auto 0;max-width:56rem;font-size:clamp(2.6rem,7vw,5rem);line-height:1.02;letter-spacing:-.05em;font-weight:400}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{letter-spacing:0;line-height:1.3}
html[lang=ja] h1{letter-spacing:-.02em;line-height:1.2}
.sub{margin:1.25rem auto 0;max-width:42rem;font-size:clamp(1rem,2vw,1.15rem);color:var(--n300)}
.tags{margin-top:1.5rem;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.chip{display:inline-flex;align-items:center;border-radius:9999px;background:rgba(96,165,250,.15);color:var(--blue3);padding:.25rem .7rem;font-size:.75rem;font-weight:500}
.ctas{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem;justify-content:center}
.btn-w{display:inline-flex;align-items:center;gap:.5rem;border-radius:9999px;background:#fff;color:#171717;padding:.75rem 1.5rem;font-size:.875rem;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.btn-g{display:inline-flex;align-items:center;gap:.5rem;border-radius:9999px;background:rgba(255,255,255,.05);backdrop-filter:blur(24px);color:rgba(255,255,255,.8);padding:.75rem 1.25rem;font-size:.875rem;font-weight:500;transition:all .2s}
.btn-w:hover,.btn-g:hover{transform:translateY(-2px)}.btn-g:hover{color:#fff}
.copy{margin-top:2rem;font-size:.75rem;color:var(--n400)}

/* layout */
.layout{display:grid;grid-template-columns:1fr;gap:2rem;padding-bottom:2rem}
@media(min-width:1024px){.layout{grid-template-columns:17rem 1fr;gap:2.5rem}}
aside{display:none}
.layout>*{min-width:0}
#langName{white-space:nowrap}
@media(max-width:560px){#langName{display:none}.lang-btn{padding:.55rem .8rem}}
@media(min-width:1024px){aside{display:block}}
.side{position:sticky;top:6rem;border-radius:24px;background:var(--card);padding:1.25rem;max-height:calc(100vh - 8rem);overflow:auto}
.side h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);font-weight:500;margin-bottom:.75rem}
.side ol{list-style:none;display:flex;flex-direction:column;gap:.15rem}
.side a{display:flex;gap:.65rem;padding:.5rem .6rem;border-radius:12px;font-size:.8rem;line-height:1.35;color:var(--n400);transition:all .2s}
.side a span{font-variant-numeric:tabular-nums;color:rgba(255,255,255,.3);font-weight:600}
.side a:hover{color:#fff;background:rgba(255,255,255,.04)}
.side a.active{color:#fff;background:rgba(96,165,250,.1)}
.side a.active span{color:var(--blue)}

.panel{border-radius:24px;background:var(--card);padding:1.5rem;backdrop-filter:blur(8px);overflow:hidden;position:relative}
@media(min-width:640px){.panel{padding:2.25rem}}
.panel+.panel{margin-top:2rem}
.label{display:flex;align-items:center;justify-content:space-between;font-size:.8rem;font-weight:500;text-transform:uppercase;letter-spacing:-.01em;color:var(--blue)}
.hr{margin-top:.5rem;height:1px;width:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent)}
h2{margin-top:1.25rem;font-size:clamp(1.9rem,4vw,3rem);line-height:1.05;letter-spacing:-.05em;font-weight:400}
html[lang=ja] h2{letter-spacing:-.02em;line-height:1.25}
.body{margin-top:1.75rem;color:var(--n300);font-size:1rem;max-width:72ch}
.body>*+*{margin-top:1rem}
.body h3{margin-top:2.25rem;font-size:1.35rem;color:#fff;letter-spacing:-.03em;font-weight:600;line-height:1.25;display:flex;align-items:center;gap:.6rem}
.body h3::before{content:"";width:.45rem;height:.45rem;border-radius:9999px;background:var(--blue);flex:none;box-shadow:0 0 10px rgba(96,165,250,.7)}
.body>h3:first-child{margin-top:0}
.body ul.dots,.body ol.num{list-style:none;display:flex;flex-direction:column;gap:.65rem}
.body ul.dots li{display:flex;gap:.75rem}
.body ul.dots li::before{content:"";flex:none;width:.375rem;height:.375rem;margin-top:.62rem;border-radius:9999px;background:var(--blue3)}
.body ol.num{counter-reset:n}
.body ol.num li{display:flex;gap:.85rem;counter-increment:n}
.body ol.num li::before{content:counter(n);flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:9999px;background:rgba(96,165,250,.15);box-shadow:inset 0 0 0 1px rgba(96,165,250,.25);color:var(--blue3);font-size:.75rem;font-weight:600;margin-top:.05rem}

.tbl{overflow-x:auto;border-radius:16px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);max-width:100%}
.body .tbl{max-width:none}
table{width:100%;border-collapse:collapse;font-size:.875rem;min-width:30rem}
th{text-align:start;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--blue3);font-weight:600;padding:.8rem 1rem;background:rgba(96,165,250,.08);white-space:nowrap}
td{padding:.75rem 1rem;border-top:1px solid rgba(255,255,255,.06);vertical-align:top;color:var(--n300)}
td:first-child{color:#fff;font-weight:500}
tr:hover td{background:rgba(255,255,255,.02)}
td.stars{color:var(--amber);letter-spacing:.1em;white-space:nowrap}
td .ln{display:block}
td .ln+.ln{margin-top:.2rem}

.note{border-radius:16px;padding:1rem 1.15rem;background:linear-gradient(90deg,rgba(59,130,246,.15),rgba(147,197,253,.08));box-shadow:inset 0 0 0 1px rgba(96,165,250,.2);display:flex;flex-direction:column;gap:.5rem}
.note .tag{align-self:flex-start;display:inline-flex;align-items:center;gap:.4rem;border-radius:9999px;background:rgba(10,10,10,.85);box-shadow:inset 0 0 0 1px rgba(96,165,250,.3);padding:.2rem .7rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--blue3);font-weight:600}
.note p{color:var(--n200)}
.ex{border-radius:16px;padding:1rem 1.15rem;background:rgba(16,185,129,.08);box-shadow:inset 0 0 0 1px rgba(52,211,153,.2)}
.ex b{display:inline-flex;align-items:center;gap:.4rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--em3);font-weight:600;margin-bottom:.35rem}
.ex p{color:var(--n200)}

.ck{list-style:none;display:flex;flex-direction:column;gap:.55rem}
.ck li{display:flex;gap:.75rem;align-items:flex-start}
.ck i{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.4rem;height:1.4rem;border-radius:9999px;margin-top:.1rem;font-style:normal}
.ck .y i{background:rgba(96,165,250,.15);box-shadow:inset 0 0 0 1px rgba(96,165,250,.25);color:var(--blue3)}
.ck .n i{background:rgba(244,63,94,.15);box-shadow:inset 0 0 0 1px rgba(251,113,133,.25);color:var(--rose)}

.tpl{border-radius:16px;background:rgba(0,0,0,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);overflow:hidden}
.tpl .bar{display:flex;align-items:center;gap:.35rem;padding:.6rem .9rem;border-bottom:1px solid rgba(255,255,255,.08)}
.tpl .bar span{width:.6rem;height:.6rem;border-radius:9999px}
.tpl .bar em{margin-inline-start:.5rem;font-style:normal;font-size:.75rem;color:rgba(255,255,255,.8);font-weight:500}
.tpl p{padding:.9rem 1rem;font-size:.9rem;color:#cbd5e1}
.tpl .hs{color:var(--blue)}

.tree{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;border-radius:16px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);padding:1rem 1.15rem;color:#cbd5e1;line-height:1.9;direction:ltr;text-align:left;overflow-x:auto;white-space:pre}
.tree b{color:var(--blue3);font-weight:600}
.tree em{color:var(--n400);font-style:normal;font-family:var(--font)}

.phase{border-radius:20px;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);padding:1.25rem 1.25rem 1.35rem;position:relative;margin-top:1.75rem}
.phase .tag{position:absolute;top:-.85rem;inset-inline-start:1.25rem;display:inline-flex;border-radius:9999px;background:var(--bg);box-shadow:inset 0 0 0 1px rgba(96,165,250,.35);padding:.25rem .85rem;font-size:.75rem;color:var(--blue3);font-weight:500;letter-spacing:-.01em}
.phase .goal{margin-top:.5rem;color:#fff;font-weight:500}
.phase ul{margin-top:.9rem}

.days{display:grid;gap:1rem;grid-template-columns:1fr}
.day{border-radius:20px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);padding:1.25rem}
.day.main{background:linear-gradient(225deg,rgba(59,130,246,.12),rgba(59,130,246,.05) 50%,rgba(59,130,246,.12));box-shadow:inset 0 0 0 1px rgba(96,165,250,.2)}
.day header{position:static;background:none;border:0;backdrop-filter:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.85rem}
.day h5{font-size:1.15rem;color:#fff;letter-spacing:-.03em;font-weight:600}
.day .when{display:inline-flex;align-items:center;gap:.4rem;border-radius:9999px;background:rgba(16,185,129,.15);box-shadow:inset 0 0 0 1px rgba(52,211,153,.2);padding:.2rem .65rem;font-size:.7rem;color:var(--em3);font-weight:500}
.day .when::before{content:"";width:.375rem;height:.375rem;border-radius:9999px;background:var(--em);animation:pulse 2s infinite}

.box{border-radius:20px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);padding:1.25rem}
.box h5{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);font-weight:500;margin-bottom:.85rem}
.box label{display:flex;gap:.75rem;align-items:flex-start;padding:.55rem .25rem;cursor:pointer;border-top:1px solid rgba(255,255,255,.05)}
.box label:first-of-type{border-top:0}
.box input{appearance:none;-webkit-appearance:none;flex:none;width:1.15rem;height:1.15rem;margin-top:.2rem;border-radius:6px;box-shadow:inset 0 0 0 1.5px rgba(147,197,253,.5);cursor:pointer;display:grid;place-content:center;transition:all .2s}
.box input:checked{background:var(--blue)}
.box input:checked::after{content:"";width:.55rem;height:.3rem;border-left:2px solid #0a0a0a;border-bottom:2px solid #0a0a0a;transform:rotate(-45deg) translate(1px,-1px)}
.box input:checked+span{color:var(--n400);text-decoration:line-through}

.toc-grid{display:grid;grid-template-columns:1fr;gap:.75rem;margin-top:1.75rem}
@media(min-width:640px){.toc-grid{grid-template-columns:1fr 1fr}}
.toc-grid a{display:flex;align-items:center;gap:1rem;border-radius:16px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);padding:.9rem 1rem;transition:all .25s}
.toc-grid a:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.toc-grid .n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:2.4rem;height:2.4rem;border-radius:12px;background:rgba(96,165,250,.15);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:var(--blue3);font-weight:600;font-size:.85rem}
.toc-grid .tt{font-size:.9rem;color:var(--n200);line-height:1.35}

.quote{text-align:center;padding:3.5rem 1.5rem}
.quote p{max-width:52rem;margin:1.25rem auto 0;font-size:clamp(1.5rem,3.4vw,2.5rem);line-height:1.2;letter-spacing:-.04em;color:#fff}
html[lang=ar] .quote p{letter-spacing:0;line-height:1.55}
.quote p::before{content:"“";color:var(--blue)}.quote p::after{content:"”";color:var(--blue)}
html[lang=ja] .quote p::before{content:"「"}html[lang=ja] .quote p::after{content:"」"}
html[lang=ar] .quote p::before{content:"«"}html[lang=ar] .quote p::after{content:"»"}

footer{margin:4rem 0 3rem}
footer .panel{display:flex;flex-direction:column;gap:1.25rem;align-items:center;justify-content:space-between}
@media(min-width:768px){footer .panel{flex-direction:row}}
footer p{font-size:.85rem;color:var(--n400)}
.totop{font-size:.85rem}
[dir=rtl] .arrow{transform:scaleX(-1)}
</style>
</head>
<body>
<div id="progress"></div>

<!-- Animated background (same as reference) -->
<div class="bg-anim" aria-hidden="true"><div data-us-project="XxCmD31vVBmiINgvYCho"></div></div>
<div class="bg-grid" aria-hidden="true"><svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0v64" fill="none" stroke="white" stroke-width="0.5"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)"/></svg></div>
<div class="glow" style="width:22rem;height:22rem;top:-6rem;inset-inline-end:-6rem;background:rgba(59,130,246,.10)"></div>
<div class="glow" style="width:18rem;height:18rem;bottom:5%;inset-inline-start:-6rem;background:rgba(96,165,250,.08)"></div>

<header>
  <div class="wrap">
    <nav class="top">
      <a href="#top" class="brand">
        <span class="logo bg-grad"><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="color:#fff;flex:none"><path fill="currentColor" d="M11.811 6.727C12.825 4.909 13.331 4 14.09 4c.757 0 1.264.909 2.277 2.727l.262.47c.288.517.432.775.657.945c.224.17.504.234 1.063.36l.51.116c1.967.445 2.95.667 3.185 1.42s-.437 1.537-1.778 3.106l-.347.406c-.381.445-.572.668-.658.944s-.057.573 0 1.168l.053.541c.203 2.094.305 3.14-.308 3.605s-1.534.041-3.377-.807l-.476-.22c-.524-.24-.786-.361-1.063-.361c-.278 0-.54.12-1.063.361l-.477.22c-1.842.848-2.763 1.272-3.376.807s-.511-1.511-.309-3.605l.053-.541c.057-.595.086-.892 0-1.168s-.276-.498-.657-.944l-.347-.406C6.57 11.575 5.9 10.79 6.135 10.038s1.218-.975 3.185-1.42l.51-.116c.559-.126.838-.19 1.063-.36s.368-.428.656-.945z"/><path fill="currentColor" fill-rule="evenodd" d="M8.745 5.202c-1.981-.57-4.107-.269-6.158.932l-.208.122a.75.75 0 0 1-.758-1.294l.208-.122C4.19 3.457 6.737 3.063 9.161 3.76l.208.06a.75.75 0 0 1-.416 1.441zM4.836 9.936a.75.75 0 0 1-.683.811c-.154.014-.27.02-.37.027a3 3 0 0 0-.444.048c-.196.038-.452.117-.915.349a.75.75 0 1 1-.67-1.342c.537-.268.926-.408 1.302-.48c.247-.048.502-.064.731-.08l.238-.016a.75.75 0 0 1 .811.683m1.082 5.92a3.99 3.99 0 0 0-3.365.733a.75.75 0 1 1-.928-1.178a5.49 5.49 0 0 1 4.635-1.015a.75.75 0 0 1-.342 1.46" clip-rule="evenodd" opacity=".5"/></svg></span>
        <b>Next Viral</b>
      </a>
      <div class="links" id="links"></div>

  function blocks(list){
    let html="", days=[];
    const flush=()=>{ if(days.length){ html+='<div class="days">'+days.map((b,i)=>'<div class="day'+(i===0?' main':'')+'"><header><h5>'+esc(b[1])+'</h5><span class="when">'+esc(b[2])+'</span></header><ul class="dots">'+b[3].map(x=>'<li><span>'+md(x)+'</span></li>').join("")+'</ul></div>').join("")+'</div>'; days=[]; } };
    list.forEach(b=>{ if(b[0]==="day"){days.push(b);} else {flush(); html+=block(b);} });
    flush(); return html;
  }

  let io;
  function render(code){
    const d = L[code] || L.pt;
    const u = d.ui;
    document.documentElement.lang = code === "pt" ? "pt-BR" : code;
    document.documentElement.dir = d.dir;
    document.title = "Next Viral — " + d.cover.title;

    $("#links").innerHTML = '<a href="#ch-1">'+esc(u.nav[0])+'</a><a href="#toc">'+esc(u.nav[1])+'</a><a href="#ch-10">'+esc(u.nav[2])+'</a>';
    $("#langName").textContent = d.name;
    $("#langCode").textContent = d.short;
    $("#langMenu").innerHTML = ORDER.filter(k=>L[k]).map(k=>'<button role="option" data-l="'+k+'" aria-current="'+(k===code)+'"><span>'+esc(L[k].name)+'</span><small>'+L[k].short+'</small></button>').join("");

    $("#hero").innerHTML =
      '<div class="anim" style="animation-delay:.1s"><span class="pill bg-grad"><span class="new">'+esc(u.badge)+'</span><span>'+esc(u.badgeText)+'</span>'+STAR+'</span></div>'+
      '<div class="anim" style="animation-delay:.2s"><p class="kicker">✦ Next Viral ✦</p><h1>'+esc(d.cover.title)+'</h1><p class="sub">'+esc(d.cover.sub)+'</p>'+
      '<div class="tags">'+d.cover.tags.map(t=>'<span class="chip bg-grad">'+esc(t)+'</span>').join("")+'</div>'+
      '<div class="ctas"><a class="btn-w" href="#ch-1">'+esc(u.start)+ARROW+'</a><a class="btn-g bg-grad" href="#toc"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>'+esc(u.seeToc)+'</a></div>'+
      '<p class="copy">'+esc(d.cover.copy)+'</p></div>';

    $("#side").innerHTML = '<h4>'+esc(u.toc)+'</h4><ol>'+d.ch.map((c,i)=>'<li><a href="#ch-'+(i+1)+'" data-i="'+(i+1)+'"><span>'+pad(i+1)+'</span>'+esc(c.t)+'</a></li>').join("")+'</ol>';

    let html = '<section class="panel bg-grad anim" id="toc"><div class="label"><span>'+esc(u.toc)+'</span><span>('+esc(u.chapters)+')</span></div><div class="hr"></div>'+
      '<div class="toc-grid">'+d.ch.map((c,i)=>'<a href="#ch-'+(i+1)+'"><span class="n">'+pad(i+1)+'</span><span class="tt">'+esc(c.t)+'</span></a>').join("")+'</div></section>';
    d.ch.forEach((c,i)=>{
      html += '<section class="panel bg-grad anim" id="ch-'+(i+1)+'"><div class="label"><span>'+esc(u.chFmt ? u.chFmt.replace("{n}", i+1) : u.ch+' '+pad(i+1))+'</span><span>('+pad(i+1)+')</span></div><div class="hr"></div>'+
        '<h2>'+esc(c.t)+'</h2><div class="body">'+blocks(c.b)+'</div></section>';
    });
    html += '<section class="panel bg-grad anim quote">'+'<span class="pill bg-grad">'+STAR+'<span>Next Viral</span></span><p>'+esc(d.quote)+'</p></section>';
    html += '<footer><div class="panel bg-grad"><a href="#top" class="brand"><span class="logo bg-grad">'+STAR+'</span><b>Next Viral</b></a><p>'+esc(d.footer)+'</p><a class="btn-g bg-grad totop" href="#top">'+esc(u.top)+' ↑</a></div></footer>';
    $("#doc").innerHTML = html;

    if (io) io.disconnect();
    io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }),{threshold:.05,rootMargin:"0px 0px -5% 0px"});
    document.querySelectorAll(".anim").forEach(el=>io.observe(el));
    spy();
  }

  function spy(){
    const secs=[...document.querySelectorAll('section[id^="ch-"]')];
    let cur=0; const y=window.scrollY+140;
    secs.forEach((s,i)=>{ if(s.offsetTop<=y) cur=i+1; });
    document.querySelectorAll(".side a").forEach(a=>a.classList.toggle("active", +a.dataset.i===cur));
    const h=document.documentElement; const p=h.scrollTop/((h.scrollHeight-h.clientHeight)||1);
    $("#progress").style.width=(p*100)+"%";
  }
  window.addEventListener("scroll", spy, {passive:true});

  function pick(){
    const q = new URLSearchParams(location.search).get("lang");
    if (q && L[q]) return q;
    try { const s = localStorage.getItem("nextviral-lang"); if (s && L[s]) return s; } catch(e){}
    const n = (navigator.language||"pt").slice(0,2).toLowerCase();
    return L[n] ? n : "pt";
  }
  function setLang(k){
    try { localStorage.setItem("nextviral-lang", k); } catch(e){}
    try { const url = new URL(location.href); url.searchParams.set("lang", k); history.replaceState(null,"",url.pathname+url.search); } catch(e){}
    render(k);
  }

  const lang=$("#lang"), btn=$("#langBtn");
  btn.addEventListener("click", e=>{ e.stopPropagation(); const o=lang.classList.toggle("open"); btn.setAttribute("aria-expanded", o); });
  $("#langMenu").addEventListener("click", e=>{ const b=e.target.closest("button[data-l]"); if(!b) return; lang.classList.remove("open"); setLang(b.dataset.l); });
  document.addEventListener("click", ()=>lang.classList.remove("open"));
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") lang.classList.remove("open"); });

  render(pick());
})();
</script>
